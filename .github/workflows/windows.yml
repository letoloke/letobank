name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build bundle
        run: python -m PyInstaller --noconfirm contapy.spec

      - name: Smoke test the bundle
        shell: pwsh
        run: |
          $shot = Join-Path $env:RUNNER_TEMP "smoke.png"
          $db = Join-Path $env:RUNNER_TEMP "smoke.db"
          $exe = (Resolve-Path ".\dist\LetoBank\LetoBank.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "--screenshot", $shot, "--size", "1500x820", "--db", $db
          ) -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            throw "The bundled app exited with $($proc.ExitCode)"
          }
          if (-not (Test-Path $shot)) {
            throw "The bundled app did not render a screenshot"
          }

      - name: Zip bundle
        shell: pwsh
        run: Compress-Archive -Path dist/LetoBank -DestinationPath LetoBank-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LetoBank-windows
          path: LetoBank-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LetoBank-windows.zip
